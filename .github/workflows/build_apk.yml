name: Build Vocal Remover APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Initialize Android Project Files
        run: flutter create --platforms=android --org com.renantefullo .

      - name: Fix Kotlin & Gradle Versions
        run: |
          # Ayusin ang minSdk at targetSdk sa build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdkVersion = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true

          # I-update ang Kotlin version sa android/settings.gradle o build.gradle kung kinakailangan
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/version "1.8.22"/version "1.9.24"/g' android/settings.gradle || true
            sed -i 's/version "1.7.10"/version "1.9.24"/g' android/settings.gradle || true
          fi
          
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/g" android/build.gradle || true
          fi

          # Magdagdag ng internet at storage permissions sa AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons:main

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Vocal-Remover-Renante-Fullo
          path: build/app/outputs/flutter-apk/app-release.apk
