name: Build Vocal Remover APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Stable 3.22.2)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Initialize Android Project Files
        run: flutter create --platforms=android --org com.renantefullo .

      - name: Force Android SDK 35 in build.gradle & Permissions
        run: |
          # Direktang palitan ang android block sa build.gradle para maging SDK 35
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            # Siguraduhing maayos ang compileSdk at targetSdk
            sed -i 's/flutter.compileSdkVersion/35/g' "$BUILD_GRADLE" || true
            sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g' "$BUILD_GRADLE" || true
            sed -i 's/targetSdkVersion.*/targetSdkVersion 35/g' "$BUILD_GRADLE" || true
            sed -i 's/minSdk = .*/minSdk = 21/g' "$BUILD_GRADLE" || true
            sed -i 's/minSdkVersion.*/minSdkVersion = 21/g' "$BUILD_GRADLE" || true
            
            # Kung wala pa ang compileSdkVersion sa loob ng android block, i-insert natin
            if ! grep -q "compileSdkVersion" "$BUILD_GRADLE"; then
              sed -i '/android {/a \    compileSdkVersion 35' "$BUILD_GRADLE" || true
            fi
          fi

          # Magdagdag ng internet at storage permissions sa AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <application/' "$MANIFEST"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Vocal-Remover-Renante-Fullo
          path: build/app/outputs/flutter-apk/app-release.apk
